name: Check
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check
        env:
          BOUNDARY_MARKER: synthetic-only-boundary-value
        run: |
          python3 -I -B - <<'PY'
          import json, os, pathlib, subprocess, sys, tempfile, uuid
          child = r'''
          import json, os, pathlib, socket
          marker = b'synthetic-only-boundary-value'
          for path in pathlib.Path('/proc').glob('[0-9]*/environ'):
              try:
                  assert marker not in path.read_bytes(), 'ancestor environment accessible'
              except (FileNotFoundError, PermissionError, ProcessLookupError):
                  pass
          assert os.getuid() == 65534
          assert not any(k.startswith(('GITHUB_', 'ACTIONS_', 'DOCKER_')) or k == 'BOUNDARY_MARKER' for k in os.environ)
          status = pathlib.Path('/proc/self/status').read_text()
          assert 'NoNewPrivs:\t1' in status
          assert 'Seccomp:\t2' in status
          assert next(x for x in status.splitlines() if x.startswith('CapEff:')).split()[1] == '0000000000000000'
          assert not pathlib.Path('/var/run/docker.sock').exists()
          assert not pathlib.Path('/host-control').exists()
          assert not pathlib.Path('/home/runner').exists()
          try:
              pathlib.Path('/root-write').write_text('x')
          except OSError:
              pass
          else:
              raise AssertionError('root filesystem writable')
          try:
              pathlib.Path('/src/input').write_text('x')
          except OSError:
              pass
          else:
              raise AssertionError('source mount writable')
          pathlib.Path('/tmp/write').write_text('ok')
          interfaces = {x.split(':')[0].strip() for x in pathlib.Path('/proc/net/dev').read_text().splitlines()[2:]}
          assert interfaces <= {'lo'}, 'external interface present'
          host_pid = pathlib.Path('/src/host-pid').read_text().strip()
          for fd in ('1', '2'):
              try:
                  with open('/proc/' + host_pid + '/fd/' + fd, 'wb', buffering=0) as output:
                      output.write(b'SYNTHETIC_ESCAPE')
              except (FileNotFoundError, PermissionError, ProcessLookupError, OSError):
                  pass
          print(json.dumps({'probe': 'passed'}))
          '''
          with tempfile.TemporaryDirectory(prefix='check-') as directory:
              root = pathlib.Path(directory)
              config = root / 'config'; config.mkdir()
              source = root / 'source'; source.mkdir(mode=0o755)
              source.joinpath('input').write_text('synthetic input')
              source.joinpath('host-pid').write_text(str(os.getpid()))
              source.joinpath('probe.py').write_text(child)
              for p in source.iterdir(): p.chmod(0o444)
              root.joinpath('host-control').write_text('synthetic control')
              env = {'PATH': '/usr/bin:/bin', 'HOME': str(root), 'DOCKER_CONFIG': str(config)}
              base = ['/usr/bin/docker', '--host', 'unix:///var/run/docker.sock']
              def command(args, timeout=120):
                  return subprocess.run(base + args, env=env, stdin=subprocess.DEVNULL,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=timeout, check=True)
              name = 'check-' + uuid.uuid4().hex
              try:
                  command(['pull', 'docker.io/library/python:3.12-slim'], timeout=240)
                  info = json.loads(command(['image', 'inspect', 'docker.io/library/python:3.12-slim']).stdout)[0]
                  image = next(x for x in info['RepoDigests'] if x.startswith('python@sha256:'))
                  args = ['create', '--name', name, '--pull', 'never', '--network', 'none',
                          '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges',
                          '--user', '65534:65534', '--pids-limit', '64', '--memory', '256m',
                          '--memory-swap', '256m', '--cpus', '1', '--log-driver', 'none',
                          '--tmpfs', '/tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777',
                          '--mount', 'type=bind,src=' + str(source) + ',dst=/src,readonly',
                          '--workdir', '/src', '--env', 'HOME=/tmp', '--env', 'TMPDIR=/tmp',
                          '--entrypoint', '/usr/local/bin/python', image, '-I', '-B', '/src/probe.py']
                  command(args)
                  saved_out, saved_err = os.dup(1), os.dup(2)
                  with (root / 'console-trap').open('w+b') as trap:
                      try:
                          os.dup2(trap.fileno(), 1); os.dup2(trap.fileno(), 2)
                          result = command(['start', '--attach', name], timeout=60)
                      finally:
                          os.dup2(saved_out, 1); os.dup2(saved_err, 2)
                          os.close(saved_out); os.close(saved_err)
                      trap.seek(0)
                      assert trap.read() == b'', 'host stdout/stderr reachable'
                  state = json.loads(command(['inspect', name]).stdout)[0]['State']
                  assert state['Status'] == 'exited' and state['ExitCode'] == 0
                  assert result.stderr == b'' and json.loads(result.stdout) == {'probe': 'passed'}
                  print('Boundary probe passed. Runtime: ' + image)
              finally:
                  command(['rm', '--force', name])
          PY
